[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erebus-framework"
version = "0.1.0"
description = "Erebus — modular security research & testing framework (authorized use only)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Erebus" }]
keywords = ["security", "pentest", "research", "framework"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8", "httpx", "fastapi", "uvicorn[standard]", "fpdf2>=2.7"]
rpc = ["fastapi", "uvicorn[standard]"]
intel = ["requests"]
connectors = ["keyring>=24"]
report = ["fpdf2>=2.7"]
creds = ["paramiko>=3"]  # optional ssh backend for auxiliary/creds/*
# everything needed to RUN Erebus (not the dev/test tooling)
all = ["fastapi", "uvicorn[standard]", "keyring>=24", "fpdf2>=2.7", "requests"]

[project.scripts]
erebus = "erebus.cli:main"
ereconsole = "erebus.console:main"

[tool.hatch.build.targets.wheel]
packages = ["erebus"]

[tool.hatch.build.targets.wheel.force-include]
"erebus/osint/data/arf.json" = "erebus/osint/data/arf.json"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
