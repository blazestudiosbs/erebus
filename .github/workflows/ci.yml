name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to 22.04: ubuntu-latest rolled to 26.04, whose setup-python
    # manifest no longer ships Python 3.9, breaking the 3.9 leg at setup.
    # 22.04 provides the whole 3.9–3.13 range.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the project's floor (requires-python >= 3.9) and the runtime
        # the FastAPI handlers must stay compatible with — keep it in the matrix.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy erebus
      - name: Tests (pytest)
        run: pytest
